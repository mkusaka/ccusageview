pre-commit:
  commands:
    react-doctor:
      run: react_doctor_output=$(mktemp "${TMPDIR:-/tmp}/react-doctor-hook.XXXXXX"); if npx --yes react-doctor@latest --staged --blocking warning > "$react_doctor_output" 2>&1; then rm -f "$react_doctor_output"; else cat "$react_doctor_output" >&2; rm -f "$react_doctor_output"; printf "%s\n" "React Doctor found staged regressions." "Run pnpm doctor --staged --blocking warning to inspect." "Want them fixed? Ask your agent to run that command and resolve the findings." >&2; fi
  parallel: true
  jobs:
    - name: format
      glob: "*.{ts,tsx,js,jsx,json,css,html}"
      run: pnpm exec oxfmt --write {staged_files}
      stage_fixed: true

    - name: lint
      glob: "*.{ts,tsx}"
      run: pnpm exec oxlint {staged_files}

    - name: typecheck
      run: pnpm exec tsc -b

    - name: test
      run: pnpm test
