# React Doctor — finds security, performance, correctness, accessibility,
# bundle-size, and architecture issues in React codebases.
#
# Docs: https://www.react.doctor/ci
# Source: https://github.com/millionco/react-doctor
#
# Scope: this workflow deliberately tracks the health of `main` only. React work
# here lands as direct commits to `main`; the PRs that do exist come from
# Renovate and update-offline-pricing.yml, which touch dependencies and pricing
# data rather than React source, so PR-time scanning earns little. The upstream
# PR half (sticky summary comment, inline review comments) is therefore removed,
# along with the `pull-requests: write` / `issues: write` permissions it needed.

name: React Doctor

on:
  # Scans `main` on every push to track the health-score trend and catch regressions.
  push:
    branches: ["main"]

permissions:
  contents: read
  statuses: write

# Cancels any in-flight scan for the same branch the moment a new commit arrives.
concurrency:
  group: react-doctor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: millionco/react-doctor@01820bb4fd4d0a4aebcd8df2b2a143a098649cb2 # v2.2.8
        # Advisory: findings are reported in the run summary and the commit
        # status (score + counts), but never fail the job. To gate later, add
        # `blocking: error`. Full reference: https://www.react.doctor/ci
